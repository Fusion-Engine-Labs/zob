name: Build

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: blacksmith-4vcpu-ubuntu-2404
        strategy:
            fail-fast: false
            matrix:
                optimize: [Debug, ReleaseSafe, ReleaseFast, ReleaseSmall]

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Zig
              uses: mlugg/setup-zig@v2
              with:
                  version: 0.17.0
                  cache-key: test-${{ matrix.optimize }}

            - name: Test project (${{ matrix.optimize }})
              run: zig build test -Doptimize=${{ matrix.optimize }} --summary all
